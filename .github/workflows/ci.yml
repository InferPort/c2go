name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build Web Frontend
        run: |
          cd web/frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./... -v -count=1 -cover

      - name: Verify Binary Build
        run: go build -o /dev/null .
