name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            binary_name: c2go
            archive_name: c2go-linux-amd64.tar.gz
          - goos: linux
            goarch: "386"
            binary_name: c2go
            archive_name: c2go-linux-386.tar.gz
          - goos: linux
            goarch: arm
            binary_name: c2go
            archive_name: c2go-linux-arm.tar.gz
          - goos: linux
            goarch: arm64
            binary_name: c2go
            archive_name: c2go-linux-arm64.tar.gz
          # macOS (Darwin)
          - goos: darwin
            goarch: amd64
            binary_name: c2go
            archive_name: c2go-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            binary_name: c2go
            archive_name: c2go-darwin-arm64.tar.gz
          # Windows
          - goos: windows
            goarch: amd64
            binary_name: c2go.exe
            archive_name: c2go-windows-amd64.zip
          - goos: windows
            goarch: "386"
            binary_name: c2go.exe
            archive_name: c2go-windows-386.zip
          - goos: windows
            goarch: arm64
            binary_name: c2go.exe
            archive_name: c2go-windows-arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build Web Frontend
        run: |
          cd web/frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Determine Version Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v0.1.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build -v \
            -ldflags="-s -w -X c2go/update.Version=${{ steps.tag_info.outputs.VERSION }}" \
            -o build/${{ matrix.binary_name }} .

      - name: Package binary
        run: |
          cd build
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip ../${{ matrix.archive_name }} ${{ matrix.binary_name }}
          else
            tar -czvf ../${{ matrix.archive_name }} ${{ matrix.binary_name }}
          fi
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Determine Version Tag & Release Notes
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v0.1.${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          git fetch --tags --unshallow || git fetch --tags 2>/dev/null || true
          PREV_TAG=$(git tag --sort=-v:refname | head -n 1)

          echo "### c2go Release $TAG_NAME" > release_notes.md
          echo "" >> release_notes.md
          echo "#### Changes:" >> release_notes.md

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG_NAME" ]; then
            git log -n 15 --oneline | sed 's/^/- /' >> release_notes.md
          else
            git log --oneline ${PREV_TAG}..HEAD | sed 's/^/- /' >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG_NAME }}
          name: Release ${{ steps.release_info.outputs.TAG_NAME }}
          body_path: release_notes.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
